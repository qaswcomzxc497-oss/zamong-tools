<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뷰포트 확인용</title>
<style>html,body{margin:0;background:#d9d4ce}iframe{border:0;display:block;background:#FBF6F1}</style>
</head>
<body>
<iframe id="f" title="미리보기"></iframe>
<script>
var p = new URLSearchParams(location.search);
var w = Number(p.get('w') || 390), h = Number(p.get('h') || 844), y = Number(p.get('y') || 0);
var src = p.get('src') || './index.html';
var f = document.getElementById('f');
f.style.width = w + 'px'; f.style.height = h + 'px';
f.onload = function () {
  try {
    var d = f.contentDocument;
    var s = d.createElement('style');
    s.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar{display:none;width:0}';
    d.head.appendChild(s);
    if (y) f.contentWindow.scrollTo(0, y);
  } catch (e) {}
};
f.src = src;
</script>
</body>
</html>
